// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

// Expose buildscript values as rootProject ext so expo-modules-core's
// kotlinVersion() resolves to 1.9.25 (fixes Compose Compiler compatibility check)
rootProject.ext.set("kotlinVersion", findProperty('android.kotlinVersion') ?: '1.9.25')

// Windows 260-char path limit workaround: pass -PshortBuildDir=C:/tmp/bd to
// relocate the MAIN app module's build outputs (.cxx, intermediates, apk) to a
// short root. We intentionally do NOT touch included builds (expo's
// gradle-plugin), otherwise shared tasks would write into one another's
// output dirs and Gradle fails with implicit-dependency errors.
def shortBuildRoot = providers.gradleProperty('shortBuildDir').orNull

allprojects { p ->
    if (shortBuildRoot && p.path == ':app') {
        p.layout.buildDirectory = new File(shortBuildRoot)
    }
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// FIX: expo-modules-core hardcodes fallback Kotlin 1.9.24 while the Compose
// Compiler extension selected is 1.5.15 (requires 1.9.25). Force a consistent
// pair and suppress the compatibility check for all subprojects.
subprojects { sp ->
  sp.plugins.withId('org.jetbrains.kotlin.android') {
    try {
      def options = sp.extensions.getByName('kotlin').androidTarget.compilerOptions
      options.freeCompilerArgs += ['-Xsuppress-version-warnings']
    } catch (ignored) {}
  }
}
